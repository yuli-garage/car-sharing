<!DOCTYPE html>

<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리집 차 어디있지? 🚗</title>
    <meta name="theme-color" content="#2563eb">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="apple-touch-icon" href="icon.svg">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="./style/main.css" />
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🚗 우리집 차 어디있지?</h1>
            <p>주차 위치를 가족과 실시간 공유하세요</p>
        </header>

    <div class="connection-status" id="connectionStatus">
        🔌 연결 상태 확인 중...
    </div>

    <main class="main-content">
        <!-- 로그인/회원가입 섹션 -->
        <div class="login-section" id="loginSection">
            <h2>🔑 그룹 접속</h2>

            <div class="login-tabs">
                <button class="login-tab active" data-tab="join">참여하기</button>
                <button class="login-tab" data-tab="create">새로 만들기</button>
            </div>

            <!-- 참여하기 폼 -->
            <div id="joinForm">
                <div class="form-group">
                    <label for="joinCode">공유 코드</label>
                    <input type="text" id="joinCode" placeholder="공유 코드를 입력하세요" style="text-transform: uppercase;">
                </div>
                <div class="form-group">
                    <label for="joinPassword">비밀번호</label>
                    <input type="password" id="joinPassword" placeholder="비밀번호를 입력하세요">
                </div>
                <div class="form-group">
                    <label for="joinNickname">내 이름</label>
                    <input type="text" id="joinNickname" placeholder="가족들이 알아볼 이름" maxlength="10">
                </div>
                <button class="btn btn-primary" id="joinBtn" style="width: 100%; margin-top: 10px;">
                    그룹 참여하기
                </button>
            </div>

            <!-- 새로 만들기 폼 -->
            <div id="createForm" style="display: none;">
                <div class="form-group">
                    <label for="createPassword">비밀번호 설정</label>
                    <input type="password" id="createPassword" placeholder="그룹 비밀번호를 설정하세요">
                </div>
                <div class="form-group">
                    <label for="createNickname">내 이름</label>
                    <input type="text" id="createNickname" placeholder="가족들이 알아볼 이름" maxlength="10">
                </div>
                <button class="btn btn-primary" id="createBtn" style="width: 100%; margin-top: 10px;">
                    새 그룹 만들기
                </button>
            </div>
        </div>

        <!-- 메인 앱 섹션 -->
        <div class="app-section" id="appSection" style="display: none;">
            <!-- 공유 정보 -->
            <div class="share-info" id="shareInfo">
                <div>🔗 그룹 공유 정보</div>
                <div style="display: flex; align-items: center; justify-content: center; gap: 5px;">
                    <div class="share-code" id="displayShareCode">LOADING...</div>
                    <button class="copy-btn" id="copyCodeBtn" title="복사하기">
                        📋
                    </button>
                </div>
                <div style="font-size: 0.9rem; color: #6b7280;">이 코드와 비밀번호를 가족에게 공유하세요</div>
            </div>

            <div class="car-list" id="carList">
                <!-- 차량 카드들이 여기에 동적으로 추가됩니다 -->
            </div>

            <button class="add-car-btn" id="showAddCarBtn">
                ➕ 새 차량 추가
            </button>

            <div class="settings">
                <h3>⚙️ 설정</h3>
                <div class="setting-item">
                    <div>
                        <div style="font-weight: bold;">스마트 알림 📱</div>
                        <div style="font-size: 0.8rem; color: #6b7280;">밤 9시에 주차 위치 업데이트 알림</div>
                    </div>
                    <div class="toggle" id="notificationToggle"></div>
                </div>
                <div class="setting-item">
                    <div>
                        <div style="font-weight: bold;">강제 새로고침</div>
                        <div style="font-size: 0.8rem; color: #6b7280;">
                            <button id="refreshBtn" style="
                                background: #10b981; color: white; border: none;
                                padding: 4px 8px; border-radius: 4px; font-size: 0.7rem;
                                margin-top: 4px; cursor: pointer;
                            ">데이터 새로고침</button>
                            <button id="clearCacheBtn" style="
                                background: #ef4444; color: white; border: none;
                                padding: 4px 8px; border-radius: 4px; font-size: 0.7rem;
                                margin-top: 4px; margin-left: 4px; cursor: pointer;
                            ">캐시 삭제</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="logout-section">
                <button class="btn-logout" id="logoutBtn">그룹 나가기</button>
            </div>
        </div>
    </main>
</div>

<!-- 차량 추가 모달 -->
<div class="modal" id="addCarModal">
    <div class="modal-content">
        <h2>새 차량 추가</h2>
        <div class="form-group">
            <label for="carName">차량 이름 (모델명 또는 애칭)</label>
            <input type="text" id="carName" placeholder="예: 소나타, 우리집 차" />
        </div>
        <div class="modal-buttons">
            <button class="btn btn-secondary" id="hideAddCarBtn">취소</button>
            <button class="btn btn-primary" id="addCarBtn">추가</button>
        </div>
    </div>
</div>

<!-- 주차 위치 업데이트 모달 -->
<div class="modal" id="updateLocationModal">
    <div class="modal-content">
        <h2 id="updateModalTitle">주차 위치 업데이트</h2>
        <div class="form-group">
            <label for="floor">주차 층</label>
            <select id="floor">
                <option value="">층 선택</option>
                <option value="B5">지하 5층</option>
                <option value="B4">지하 4층</option>
                <option value="B3">지하 3층</option>
            </select>
        </div>
        <div class="form-group">
            <label for="section">구역/위치</label>
            <input type="text" id="section" placeholder="예: A-15, 여성주차장, 전기차구역, 출구 앞" />
        </div>
        <div class="modal-buttons">
            <button class="btn btn-secondary" id="hideUpdateModalBtn">취소</button>
            <button class="btn btn-primary" id="updateLocationBtn">업데이트</button>
        </div>
    </div>
</div>

<!-- 알림 -->
<div class="notification" id="notification"></div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script type="module" src="./src/main.js"></script>
</body>
</html>
